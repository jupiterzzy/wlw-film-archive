<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="按年份、国家或地区、首字母与分类浏览 WLW 电影的个人影像档案。"
    />
    <title>WLW Film Archive</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23131118'/%3E%3Cpath d='M14 20h36v27H14z' fill='%23f05278'/%3E%3Cpath d='M20 14l7 10m5-10 7 10m5-10 6 9' stroke='%23f7f3ee' stroke-width='5'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./countries.css" />
  </head>

  <body>
    <header class="hero" id="hero">
      <div class="hero-shade"></div>

      <div class="hero-content">
        <p class="eyebrow">WLW FILM ARCHIVE</p>
        <h1 class="sr-only">WLW 电影档案</h1>

        <form class="search" id="search-form" role="search" autocomplete="off">
          <label class="sr-only" for="film-search">搜索电影</label>
          <span class="search-icon" aria-hidden="true"></span>

          <input
            id="film-search"
            type="search"
            placeholder="搜索电影名或译名（支持中英文搜索）"
            aria-controls="search-results"
            aria-expanded="false"
          />

          <button type="submit">搜索</button>

          <div
            class="search-results"
            id="search-results"
            role="listbox"
            hidden
          ></div>
        </form>
      </div>

      <div class="slide-status" aria-label="背景图片轮播">
        <span id="slide-count">01 / 05</span>
        <div class="slide-line">
          <span id="slide-progress"></span>
        </div>
      </div>
    </header>

    <main>
      <nav class="view-switcher" aria-label="其他浏览方式">
        <a class="outline-button" href="./year.html">按年份</a>
        <a class="outline-button" href="./countries.html">按国家和地区</a>
        <a class="outline-button" href="./alphabet.html">按首字母</a>
        <a class="outline-button" href="./collections.html">collections</a>
        <a class="outline-button" href="./authors-picks.html">author’s picks</a>
      </nav>

      <section
        class="home-genre-directory"
        aria-label="电影分类目录"
      >
        <div class="region-field genre-field" id="genre-field"></div>
      </section>
    </main>

    <template id="genre-template">
      <a class="region-crystal" href="#">
        <span class="country-code"></span>
      </a>
    </template>

    <script src="./catalog-data.js"></script>
    <script src="./movie-metadata.js"></script>
    <script src="./movie-data-utils.js"></script>
    <script src="./genre-data.js"></script>
    <script src="./app.js"></script>
    <script src="./genres.js"></script>
    <script src="./history-nav.js"></script>
  </body>
</html>
