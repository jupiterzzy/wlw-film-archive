<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="按国家或地区浏览 WLW 电影。" />
    <title>国家或地区 · WLW Film Archive</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./countries.css" />
  </head>
  <body class="countries-page">
    <header class="country-header">
      <a class="archive-mark" href="./index.html">WLW FILM ARCHIVE</a>
      <a class="back-link" href="./index.html">返回首页</a>
    </header>
    <main class="country-main">
      <div class="country-heading">
        <p class="country-kicker">BROWSE BY</p>
        <h1>国家或地区</h1>
      </div>
      <section class="place-section" aria-labelledby="countries-title">
        <h2 id="countries-title">国家</h2>
        <div class="country-field" id="country-field"></div>
      </section>
      <section class="place-section region-section" aria-labelledby="regions-title">
        <h2 id="regions-title">地区</h2>
        <div class="region-field" id="region-field"></div>
      </section>
    </main>
    <template id="country-template">
      <a class="country-orb" href="#"><span class="country-code"></span></a>
    </template>
    <template id="region-template">
      <a class="region-crystal" href="#"><span class="country-code"></span></a>
    </template>
    <script src="./countries.js"></script>
    <script src="./history-nav.js"></script>
  </body>
</html>
