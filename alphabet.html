<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="按首字母浏览 WLW Film Archive。"

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23131118'/%3E%3Cpath d='M14 20h36v27H14z' fill='%23f05278'/%3E%3Cpath d='M20 14l7 10m5-10 7 10m5-10 6 9' stroke='%23f7f3ee' stroke-width='5'/%3E%3C/svg%3E"

    <link rel="stylesheet" href="./styles.css" />

  <body class="countries-page alphabet-page">
    <header class="country-header">
      <a class="archive-mark" href="./index.html">WLW FILM ARCHIVE</a>
      <a class="back-link" href="./index.html">返回首页</a>

    <main class="country-main">
      <div class="country-heading">
        <p class="country-kicker">BROWSE BY</p>
        <h1>按首字母</h1>
      </div>

      <section class="catalog" aria-labelledby="catalog-title">
        <div class="catalog-heading">
          <h2 id="catalog-title">A</h2>
        </div>

        <div class="movie-grid" id="movie-grid"></div>
      </section>

      <nav class="alphabet-pagination" aria-label="按首字母浏览">
        <div class="alphabet-track" id="alphabet-track"></div>
      </nav>
    </main>

    <template id="movie-card-template">
      <article class="movie-card">
        <a class="poster-link" href="#">
          <img class="poster" src="" alt="" />
          <span class="poster-placeholder" aria-hidden="true">IMAGE</span>
        </a>

        <div class="movie-copy">
          <h3><a href="#"></a></h3>
          <p class="movie-meta"></p>
        </div>
      </article>
    </template>

    <script src="./catalog-data.js"></script>
    <script src="./movie-metadata.js"></script>
    <script src="./movie-data-utils.js"></script>
    <script src="./alphabet.js"></script>
    <script src="./history-nav.js"></script>
