<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    >
    <meta
      name="description"
      content="按国家或地区浏览 WLW 电影。"
    >

    <title>
      国家或地区 · WLW Film Archive
    </title>

    <link
      rel="stylesheet"
      href="./styles.css"
    >

    <link
      rel="stylesheet"
      href="./listing.css"
    >
  </head>

  <body class="listing-page">

    <header class="listing-header">
      <a href="./index.html">
        WLW FILM ARCHIVE
      </a>

      <nav>
        <a href="./countries.html">
          国家和地区
        </a>

        <a href="./index.html">
          首页
        </a>
      </nav>
    </header>

    <main class="listing-main">

      <div
        class="listing-title-row country-title-row"
      >
        <h1 id="listing-title">
          —
        </h1>

        <p
          class="listing-subtitle"
          id="listing-subtitle"
        ></p>
      </div>


      <!-- 只会在 USA 页面显示 -->
      <nav
        class="year-controls"
        id="country-year-controls"
        aria-label="美国电影年份筛选"
        hidden
      >

        <a
          id="country-ascending"
          class="sort-button"
          href="#"
        >
          从早到晚
        </a>

        <a
          id="country-descending"
          class="sort-button"
          href="#"
        >
          从晚到早
        </a>

        <form
          class="year-range-form"
          id="country-year-range-form"
        >

          <span class="year-range-label">
            从
          </span>

          <input
            id="country-year-from"
            class="year-range-input"
            type="number"
            inputmode="numeric"
            min="1800"
            max="2100"
            placeholder="1988"
            aria-label="起始年份"
          >

          <span class="year-range-label">
            到
          </span>

          <input
            id="country-year-to"
            class="year-range-input"
            type="number"
            inputmode="numeric"
            min="1800"
            max="2100"
            placeholder="1998"
            aria-label="结束年份"
          >

          <button
            class="year-range-submit"
            type="submit"
          >
            确定
          </button>

        </form>

      </nav>


      <div
        class="listing-grid"
        id="listing-grid"
      ></div>

      <nav
        class="listing-pagination"
        id="listing-pagination"
        aria-label="页面"
      ></nav>

    </main>


    <template id="listing-card-template">

      <article class="movie-card">

        <a
          class="poster-link"
          href="#"
          aria-label="电影详情暂未制作"
        >
          <span
            class="poster-placeholder"
            aria-hidden="true"
          >
            IMAGE
          </span>
        </a>

        <div class="movie-copy">

          <h3>
            <a href="#"></a>
          </h3>

          <p class="movie-meta"></p>

        </div>

      </article>

    </template>


    <script src="./catalog-data.js"></script>
    <script src="./movie-metadata.js"></script>
    <script src="./movie-data-utils.js"></script>
    <script src="./country.js"></script>
    <script src="./history-nav.js"></script>

  </body>
</html>
